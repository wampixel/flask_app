[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-talisman>=1.1.0",
    "pydantic>=2.13.5",
    "spectree>=3.0.0",
    "sqlalchemy>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.ruff]
line-length = 120
exclude = ["migrations/**/*.py"]
lint.select = [
    "E",
    "F",
    "I",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
