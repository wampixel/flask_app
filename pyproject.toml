[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "click>=8.5.0",
    "flake8>=7.4.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "pydantic>=2.13.5",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sqlalchemy>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]
